<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1113" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Mambay Kanu</title>
  <link rel="icon" type="image/png" href="/media/opt/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="/styles.css" />
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: var(--ink);
      color: var(--on-dark);
    }
    .notfound h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--on-dark);
      margin-bottom: 0.6rem;
    }
    .notfound p {
      color: var(--on-dark-soft);
      margin-inline: auto;
      max-width: 42ch;
      margin-bottom: 2rem;
    }
    .notfound .mark { height: 34px; width: auto; margin: 0 auto 2.5rem; filter: invert(1); }
  </style>
</head>
<body>
  <main class="notfound">
    <a href="/" aria-label="Mambay Kanu, home">
      <img class="mark" src="/media/opt/mk-mark.webp" alt="Mambay Kanu" width="600" height="352" />
    </a>
    <h1>We couldn&rsquo;t find that page.</h1>
    <p>The link may be out of date, or the address might have a typo in it. Everything we publish lives on the home page.</p>
    <a href="/" class="btn btn-accent">Back to the home page</a>
  </main>
</body>
</html>
