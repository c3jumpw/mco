<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Vaultleaf</title>
<meta name="description" content="Vaultleaf: an encrypted password vault that reads like your notes.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaultleaf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/ahn-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  /* Vaultleaf — every account is a leaf in a locked book.
     Palette: cool ledger paper, bottle-green ink, key brass for anything secret.
     Layout: sidebar (labels) | list of leaves | the open leaf. Phone: one pane, the leaf slides over. */
  --paper:#EEF2EF;
  --surface:#FFFFFF;
  --sunken:#E3E9E5;
  --ink:#15201B;
  --muted:#56665D;
  --line:#D2DBD5;
  --leaf:#1D5B44;
  --leaf-ink:#FFFFFF;
  --leaf-soft:#D9EADF;
  --brass:#87651A;
  --brass-soft:#F4E8C8;
  --danger:#B42318;
  --danger-soft:#FBE3E0;
  --warn:#9A5800;
  --warn-soft:#FBEBD3;
  --ok:#1F7A47;
  --shadow:0 1px 2px rgba(21,32,27,.06),0 8px 24px rgba(21,32,27,.08);
  --rule:rgba(29,91,68,.10);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1311; --surface:#141C18; --sunken:#1A2420; --ink:#E3EAE5; --muted:#93A399; --line:#25312B;
    --leaf:#62C298; --leaf-ink:#08130E; --leaf-soft:#173126; --brass:#DDB257; --brass-soft:#352B12;
    --danger:#FF8A7E; --danger-soft:#3A1714; --warn:#F2B35C; --warn-soft:#382711; --ok:#6FD39C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --rule:rgba(98,194,152,.09);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1311; --surface:#141C18; --sunken:#1A2420; --ink:#E3EAE5; --muted:#93A399; --line:#25312B;
  --leaf:#62C298; --leaf-ink:#08130E; --leaf-soft:#173126; --brass:#DDB257; --brass-soft:#352B12;
  --danger:#FF8A7E; --danger-soft:#3A1714; --warn:#F2B35C; --warn-soft:#382711; --ok:#6FD39C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); --rule:rgba(98,194,152,.09);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--leaf)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.sec-in{-webkit-text-security:disc}
kbd{font-family:var(--font-mono);font-size:13px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
svg.i.l{width:24px;height:24px}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);font-weight:700;border:1px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn.on{color:var(--brass)}
.field{display:grid;gap:6px}
.field>label,.lbl{font-size:14px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 20%,transparent)}
.input-row{display:flex;gap:6px;align-items:stretch}
.input-row .input{flex:1;min-width:0}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .input{padding-right:48px}
.input-wrap .icon-btn{position:absolute;right:3px}
.hint{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--danger);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--leaf);flex:none}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--leaf)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--leaf);outline-offset:2px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);gap:2px}
.seg button{min-height:34px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- Brand ---------- */
.mark{display:block}
.mark .leafbody{fill:var(--leaf)}
.mark .hole{fill:var(--paper)}
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em;line-height:1}

/* ---------- Auth (setup / login) ---------- */
.auth{height:100%;overflow:auto;display:grid;grid-template-columns:1fr;background:var(--paper)}
.auth-brand{padding:28px 20px 8px;display:flex;align-items:center;gap:12px}
.auth-brand .wordmark{font-size:30px}
.auth-art{display:none}
.auth-main{display:flex;justify-content:center;padding:12px 16px 40px}
.auth-card{width:100%;max-width:440px;display:grid;gap:18px;align-content:start}
.auth-card h1{font-size:30px;line-height:1.1}
.auth-card p{margin:0}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--leaf)}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.meter>b{display:block;height:100%;width:0;border-radius:6px;transition:width .2s,background .2s}
.meter-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.pins{display:flex;gap:10px;justify-content:center;margin:6px 0}
.pins i{width:44px;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:border-color .15s,transform .15s}
.pins i.f{border-color:var(--leaf)}
.pins i.f::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink)}
.pins.n8 i{width:34px;height:46px}
.pins.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:4px auto 0;width:100%}
.keypad button{height:62px;border-radius:50%;width:62px;justify-self:center;font-family:var(--font-display);font-size:26px;font-weight:600;background:var(--surface);border:1px solid var(--line);transition:background .1s,transform .1s}
.keypad button:active{background:var(--leaf-soft);transform:scale(.96)}
.keypad button.txt{font-family:var(--font-body);font-size:14px;font-weight:700;border-color:transparent;background:transparent;color:var(--muted)}
.keypad button[disabled]{opacity:.4}
.rk{font-family:var(--font-mono);font-size:19px;letter-spacing:.04em;padding:14px 12px;border-radius:var(--r-md);background:var(--brass-soft);color:var(--ink);text-align:center;border:1px dashed var(--brass);line-height:1.6}
.rk span{display:inline-block;white-space:nowrap}
.points{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.points li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.points svg{color:var(--brass);margin-top:2px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--leaf);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{height:100%;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted)}

@media (min-width:900px){
  .auth{grid-template-columns:minmax(360px,44%) 1fr}
  .auth-art{display:flex;flex-direction:column;justify-content:space-between;padding:48px;background:var(--leaf);color:var(--leaf-ink);position:relative;overflow:hidden}
  .auth-art .mark .leafbody{fill:var(--leaf-ink)}
  .auth-art .mark .hole{fill:var(--leaf)}
  .auth-art .wordmark{font-size:clamp(56px,6vw,88px)}
  .auth-art .tagline{font-family:var(--font-display);font-size:24px;font-weight:600;max-width:16ch;line-height:1.15;margin:18px 0 0}
  .auth-art .points{max-width:34ch;margin-top:40px}
  .auth-art .points svg{color:var(--leaf-ink);opacity:.8}
  .auth-art .ruled{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 35px,color-mix(in srgb,var(--leaf-ink) 10%,transparent) 35px 36px);pointer-events:none}
  .auth-art>*{position:relative}
  .auth-brand{display:none}
  .auth-main{align-items:center;padding:40px}
}

/* ---------- Shell ---------- */
.shell{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto}
.side{display:none}
.main{position:relative;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.pane{min-height:0;overflow:auto;overscroll-behavior:contain}
.list-pane{display:flex;flex-direction:column;overflow:hidden}
.list-head{padding:14px 16px 8px;display:grid;gap:10px;background:var(--paper);border-bottom:1px solid transparent}
.title-row{display:flex;align-items:center;gap:8px;min-height:44px}
.add-btn{display:none}
@media (min-width:1100px){.m-only{display:none!important}}
@media (min-width:760px){.add-btn{display:inline-flex}}
.title-row h1{font-size:26px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-row .mark-sm{display:flex;align-items:center;gap:8px}
.count{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--muted);margin-left:6px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:40px;padding-right:40px;border-radius:14px;background:var(--surface)}
.search .clear{position:absolute;right:3px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.list-tools{display:flex;align-items:center;gap:8px;justify-content:space-between}
.list-tools select{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.list{flex:1;overflow:auto;overscroll-behavior:contain;padding:4px 12px 120px}
.banner{margin:6px 4px 10px;padding:12px 14px;border-radius:var(--r-md);background:var(--brass-soft);display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.banner b{flex:1;min-width:180px;font-weight:400}
.empty{padding:48px 16px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{color:var(--ink);font-size:22px}

/* Modern card rows */
.card{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);cursor:pointer;position:relative;transition:background .12s}
.card+.card{margin-top:2px}
.card:hover{background:var(--sunken)}
.card[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.mono-tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:19px;color:#fff;letter-spacing:-.02em}
.card .t{min-width:0}
.card .t1{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.card .t1>span:first-child{flex:0 1 auto;min-width:3ch;max-width:100%}
.card .t1 .an{font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 0;min-width:0}
.card .t2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag .dot{width:7px;height:7px;border-radius:50%}
.quick{display:flex;gap:2px}
.quick .icon-btn{width:38px;height:38px}
.star{color:var(--brass)}
mark{background:var(--brass-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Classic (notes) rows */
.shell[data-view="classic"] .list{padding:0 0 120px}
.group-h{font-family:var(--font-display);font-size:15px;font-weight:700;padding:16px 20px 6px;color:var(--ink)}
.note-row{display:block;padding:11px 20px 12px;cursor:pointer;border-bottom:1px solid var(--line);margin-left:0}
.note-row:hover{background:var(--sunken)}
.note-row[aria-current="true"]{background:var(--brass-soft)}
.note-row .nt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row .np{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row .np time{color:var(--ink);margin-right:8px}

/* ---------- Detail (the open leaf) ---------- */
.detail-pane{background:var(--surface);display:none}
.detail-empty{height:100%;display:grid;place-items:center;align-content:center;gap:10px;color:var(--muted);text-align:center;padding:24px}
.detail-empty .mark .leafbody{fill:var(--line)}
.detail-empty .mark .hole{fill:var(--surface)}
.d-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:4px;padding:8px 10px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.d-top .sp{flex:1}
.back{display:inline-flex}
.d-body{padding:20px 20px 120px;max-width:720px;margin:0 auto;display:grid;gap:22px}
.d-head{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.d-head .mono-tile{width:56px;height:56px;font-size:24px;border-radius:15px}
.d-head h2{font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.d-head .sub{color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sec{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{font-size:17px}
.sec-wrap{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:11px 8px 11px 16px;min-height:62px;cursor:pointer;position:relative}
.frow+.frow{border-top:1px solid var(--line)}
.frow:hover{background:color-mix(in srgb,var(--sunken) 60%,transparent)}
.frow .fl{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .fv{font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}
.frow .fv.mono{font-size:16px;letter-spacing:.02em}
.frow .fa{grid-row:1/3;grid-column:2;display:flex;gap:0;align-items:center}
.frow.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--leaf-soft)}100%{background:transparent}}
.masked{letter-spacing:.14em;color:var(--muted)}
.ch-d{color:var(--brass)} .ch-s{color:var(--leaf)} .ch-u{color:var(--ink)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:6px}
.words span{font-family:var(--font-mono);font-size:15px;padding:6px 8px;border-radius:8px;background:var(--sunken);white-space:nowrap}
.words span i{font-style:normal;color:var(--muted);margin-right:6px;font-size:12px}
.totp{display:flex;align-items:center;gap:10px}
.totp b{font-family:var(--font-mono);font-size:22px;letter-spacing:.08em;font-weight:600}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--leaf);transition:stroke-dashoffset 1s linear}
.ring.low .fg{stroke:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--leaf-soft);color:var(--ok)}
.pill.info{background:var(--sunken);color:var(--muted)}
.notes-box{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line)}
.meta-grid div{background:var(--surface);padding:12px 16px;display:grid;gap:2px}
.meta-grid span{font-size:13px;font-weight:700;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{min-height:44px;padding:0 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--leaf)}
.log{list-style:none;margin:0;padding:4px 0}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 16px;font-size:15px}
.log li+li{border-top:1px solid var(--line)}
.log .when{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.log .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.log .ic.copy{background:var(--brass-soft);color:var(--brass)}
.log .ic.pw{background:var(--leaf-soft);color:var(--leaf)}
.log .what{min-width:0;overflow-wrap:anywhere}
.log .what small{display:block;color:var(--muted);font-size:13px}

/* Classic leaf */
.shell[data-view="classic"] .detail-pane{background:var(--surface)}
.paper{padding:22px 22px 120px;max-width:760px;margin:0 auto;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 92px;min-height:100%}
.paper .when{font-size:14px;color:var(--muted);text-align:center;margin:0 0 14px}
.paper h2{font-family:var(--font-body);font-size:26px;font-weight:700;letter-spacing:0;line-height:1.25;margin-bottom:6px}
.nline{display:flex;align-items:flex-start;gap:6px;min-height:32px;line-height:32px;font-size:17px}
.nline .k{color:var(--muted);flex:none}
.nline .v{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.nline .v.secret{cursor:pointer;border-radius:6px}
.nline .v.secret:hover{background:var(--brass-soft)}
.nline .acts{display:flex;flex:none;opacity:.75}
.nline .acts .icon-btn{width:32px;height:32px}
.nline.free{white-space:pre-wrap}
.nline.gap{min-height:32px}
.classic-edit{width:100%;min-height:60vh;border:0;outline:none;resize:none;background:transparent;font-size:17px;line-height:32px;padding:0;font-family:var(--font-body);color:var(--ink)}
.cheat{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.cheat code{font-family:var(--font-mono);background:var(--sunken);padding:1px 5px;border-radius:5px;font-size:13px}

/* ---------- Editor ---------- */
.ed{padding:18px 18px 140px;max-width:720px;margin:0 auto;display:grid;gap:22px}
.ed-sec{display:grid;gap:12px}
.ed-sec>h3{font-size:17px;display:flex;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.rowcard{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper)}
.rowcard .rc-top{display:flex;gap:6px}
.rowcard .rc-top .input{flex:1;min-width:0}
.rowcard select.input{flex:0 0 132px;padding-right:4px}
.addbar{display:flex;gap:6px;flex-wrap:wrap}
.addbar .chip{border-style:dashed}
.ed-foot{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:4}
.labelpick{display:flex;gap:6px;flex-wrap:wrap}
.labelpick .chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}

/* ---------- Pages (generator, health, activity, settings) ---------- */
.page-pane{display:none}
.page{padding:18px 16px 140px;max-width:760px;margin:0 auto;display:grid;gap:22px}
.page>h1{font-size:30px}
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.panel-b{padding:16px;display:grid;gap:14px}
.panel-h{padding:14px 16px 0}
.panel-h h2{font-size:19px}
.panel-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.gen-out{font-family:var(--font-mono);font-size:24px;line-height:1.35;padding:22px 18px;min-height:96px;overflow-wrap:anywhere;letter-spacing:.02em;background:var(--paper);border-bottom:1px solid var(--line)}
.gen-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.range{width:100%;accent-color:var(--leaf);height:28px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px}
.opt-row+.opt-row{border-top:1px solid var(--line)}
.opt-row .ol{display:grid}
.opt-row .ol small{color:var(--muted);font-size:14px}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px}
.score-dial{width:96px;height:96px;position:relative}
.score-dial svg{width:96px;height:96px;transform:rotate(-90deg)}
.score-dial circle{fill:none;stroke-width:9}
.score-dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:30px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.stat-row div{background:var(--surface);padding:12px 14px}
.stat-row b{font-family:var(--font-display);font-size:24px;display:block}
.stat-row span{font-size:13px;color:var(--muted);font-weight:700}
.hrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 16px;cursor:pointer}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow:hover{background:var(--sunken)}
.hrow .mono-tile{width:36px;height:36px;font-size:15px;border-radius:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;min-height:58px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .ol{display:grid;min-width:0}
.set-row .ol small{color:var(--muted);font-size:14px}
.set-row select.input{width:auto;min-height:40px;padding:6px 10px}
.labels-tree{display:grid}
.lt-row{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:48px}
.lt-row+.lt-row{border-top:1px solid var(--line)}
.lt-row .nm{flex:1;min-width:0;font-weight:700}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync-dot.ok{background:var(--ok)} .sync-dot.busy{background:var(--brass)} .sync-dot.err{background:var(--danger)}

.side-link{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;font-weight:700;color:var(--muted);text-decoration:none}
.side-link:hover{background:var(--sunken);color:var(--ink)}
.page-pane.is-guide{overflow:hidden}
.guide-wrap{height:100%;display:flex;flex-direction:column}
.guide-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.guide-bar .sp{flex:1}
.guide-frame{flex:1;width:100%;border:0;background:var(--paper)}
a.btn{text-decoration:none;color:inherit}
/* ---------- Bottom nav & FAB ---------- */
.bnav{display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;font-size:12px;font-weight:700;color:var(--muted)}
.bnav button[aria-current="page"]{color:var(--leaf)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--leaf) 40%,transparent);z-index:5}
.fab svg{width:28px;height:28px}

/* ---------- Mobile: detail slides over ---------- */
@media (max-width:759px){
  .shell.detail-open .detail-pane{display:block;position:fixed;inset:0;z-index:20;animation:slidein .22s ease-out}
  .shell.detail-open .fab{display:none}
  .shell.tab-other .list-pane,.shell.tab-other .fab{display:none}
  .shell.tab-other .page-pane{display:block}
}
@keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:760px){
  .main{grid-template-columns:minmax(320px,380px) 1fr}
  .list-pane{border-right:1px solid var(--line)}
  .detail-pane{display:block}
  .back{display:none}
  .fab{display:none}
  .shell.tab-other .main{grid-template-columns:1fr}
  .shell.tab-other .list-pane,.shell.tab-other .detail-pane,.shell.tab-other .fab{display:none}
  .shell.tab-other .page-pane{display:block}
}
@media (min-width:1100px){
  .shell{grid-template-columns:248px 1fr;grid-template-rows:1fr}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);overflow:auto;background:var(--paper)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
  .side .brand .wordmark{font-size:24px}
  .side-nav{display:grid;gap:2px}
  .side-nav button,.side-lbl{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:10px;font-weight:700;color:var(--muted);text-align:left;width:100%}
  .side-nav button:hover,.side-lbl:hover{background:var(--sunken);color:var(--ink)}
  .side-nav button[aria-current="page"],.side-lbl[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .side-lbl .n{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}
  .side-lbl .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .side h4{font-family:var(--font-display);font-size:14px;margin:18px 10px 6px;color:var(--ink)}
  .side .grow{flex:1}
  .side .side-foot{display:grid;gap:6px;padding:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);position:sticky;bottom:-18px;background:var(--paper);margin:0 -12px -18px;padding:10px 22px 18px}
  .main .chips{display:none}
  .main .chips.always{display:flex}
}

/* ---------- Modal & toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.48);display:grid;place-items:end center;z-index:50;animation:fade .15s}
@media (min-width:640px){.scrim{place-items:center}}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto;animation:rise .2s ease-out}
@media (min-width:640px){.modal{border-radius:22px}}
.modal.wide{max-width:720px}
.m-h{display:flex;align-items:center;gap:8px;padding:16px 16px 8px 20px}
.m-h h2{font-size:21px;flex:1}
.m-b{padding:6px 20px 16px;display:grid;gap:14px;align-content:start;overflow:auto}
.m-b p{margin:0}
.m-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));display:grid;gap:8px;z-index:60;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
@media (min-width:760px){.toasts{top:auto;bottom:28px}}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:rise .2s ease-out}
.toast svg{color:var(--brass)}
.preview-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-md);max-height:260px;overflow:auto}
.preview-list li{padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
.preview-list li+li{border-top:1px solid var(--line)}
.menu{display:grid;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:12px;text-align:left;font-weight:700}
.menu button:hover{background:var(--sunken)}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.menu button.danger{color:var(--danger)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- encoding ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const rand = n => crypto.getRandomValues(new Uint8Array(n));
function b64e(u8){ let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(u8){ let bits = 0, val = 0, out = ''; for(const b of u8){ val = ((val << 8) | b) & 0xFFFF; bits += 8; while(bits >= 5){ out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } } if(bits > 0) out += B32[(val << (5 - bits)) & 31]; return out; }
function b32dec(s){ s = String(s).toUpperCase().replace(/=+$/,'').replace(/[^A-Z2-7]/g, ''); let bits = 0, val = 0; const out = []; for(const c of s){ val = ((val << 5) | B32.indexOf(c)) & 0xFFFF; bits += 5; if(bits >= 8){ out.push((val >>> (bits - 8)) & 255); bits -= 8; } } return new Uint8Array(out); }
const uid = () => b32enc(rand(10)).toLowerCase();
const DEVICE = (() => { let d = LS.get(K.device); if(!d){ d = 'd' + uid(); LS.set(K.device, d); } return d; })();

/* ---------- crypto ---------- */
const norm = s => String(s || '').normalize('NFKC');
const credStr = (pw, pc) => norm(pw) + '\u0000' + String(pc);
async function kdf(secret, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(key, bytes, ad){
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:te.encode(ad)}, key, bytes);
  return {iv:b64e(iv), ct:b64e(new Uint8Array(ct))};
}
async function unseal(key, box, ad){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(box.iv), additionalData:te.encode(ad)}, key, b64d(box.ct));
  return new Uint8Array(pt);
}
function newRecoveryKey(){ return b32enc(rand(20)).match(/.{4}/g).join('-'); }
function normRK(s){ return String(s || '').toUpperCase().replace(/0/g,'O').replace(/1/g,'I').replace(/8/g,'B').replace(/[^A-Z2-7]/g, ''); }
async function wrapCreds(pw, pc, dekRaw){
  const salt = rand(16);
  const kek = await kdf(credStr(pw, pc), salt, KDF_ITER);
  return {pcLen:String(pc).length, kdf:{alg:'PBKDF2-SHA256', iter:KDF_ITER, salt:b64e(salt)}, wrap:await seal(kek, dekRaw, 'vl-wrap'), credAt:now()};
}
async function wrapRecovery(rk, dekRaw){
  const salt = rand(16);
  const kek = await kdf(normRK(rk), salt, RK_ITER);
  return {rkdf:{iter:RK_ITER, salt:b64e(salt)}, rwrap:await seal(kek, dekRaw, 'vl-rwrap'), rkAt:now()};
}
async function makeHeader(pw, pc, dekRaw, rk){
  const a = await wrapCreds(pw, pc, dekRaw);
  const b = await wrapRecovery(rk, dekRaw);
  return {app:APP, v:VER, ...a, ...b, createdAt:now(), hdrAt:now()};
}
async function unwrapCreds(h, pw, pc){
  const kek = await kdf(credStr(pw, pc), b64d(h.kdf.salt), h.kdf.iter);
  return unseal(kek, h.wrap, 'vl-wrap');
}
async function unwrapRecovery(h, rk){
  const kek = await kdf(normRK(rk), b64d(h.rkdf.salt), h.rkdf.iter);
  return unseal(kek, h.rwrap, 'vl-rwrap');
}
const dekKey = raw => crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
const canGz = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
async function gz(u8, compress){
  const cs = compress ? new CompressionStream('gzip') : new DecompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
}
async function sealVault(key, vault){
  let bytes = te.encode(JSON.stringify(vault)), z = false;
  if(canGz){ try{ bytes = await gz(bytes, true); z = true; }catch(e){} }
  const box = await seal(key, bytes, 'vl-body');
  return {...box, z, at:vault.updatedAt, rev:'r' + now().toString(36) + b32enc(rand(4)).toLowerCase()};
}
async function openVault(key, body){
  let bytes = await unseal(key, body, 'vl-body');
  if(body.z) bytes = await gz(bytes, false);
  return JSON.parse(td.decode(bytes));
}

/* ---------- failed-attempt guard ---------- */
const guard = {
  get(){ return LS.get(K.guard) || {fails:0, until:0}; },
  fail(){ const g = this.get(); g.fails++; if(g.fails >= 5) g.until = now() + Math.min(900, 30 * 2 ** (g.fails - 5)) * 1000; LS.set(K.guard, g); return g; },
  reset(){ LS.del(K.guard); },
  wait(){ return Math.max(0, Math.ceil((this.get().until - now()) / 1000)); }
};

/* ---------- cloud sync (encrypted blobs only, in the viewer's private space) ---------- */
const Cloud = {
  ready:false, db:null, uid:null, status:'off', lastAt:0, err:'', pushing:false, again:false, unsub:null, lastRev:null, lastHdr:'',
  async init(){
    try{
      if(!(window.claude && typeof window.claude.use === 'function')) return false;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db || !user || typeof user.id !== 'function') return false;
      const id = await user.id();
      if(!id) return false;
      this.db = db; this.uid = String(id); this.ready = true;
      return true;
    }catch(e){ return false; }
  },
  ref(id){ return this.db.collection('data/users/' + this.uid).doc(id); },
  async retry(fn){ try{ return await fn(); }catch(e){ if(e && e.code === 'unavailable'){ await sleep(400 + Math.random() * 700); return fn(); } throw e; } },
  async getHeader(){ const s = await this.retry(() => this.ref('vl-header').get()); return s.exists ? clone(s.data()) : null; },
  async getMeta(){ const s = await this.retry(() => this.ref('vl-meta').get()); return s.exists ? clone(s.data()) : null; },
  async getBody(meta){
    meta = meta || await this.getMeta();
    if(!meta || meta.off) return null;
    const parts = [];
    for(let i = 0; i < meta.n; i++){
      const s = await this.retry(() => this.ref(`vl-b-${meta.rev}-${i}`).get());
      if(!s.exists) throw new Error('The synced copy is still uploading. Try again in a moment.');
      parts.push(s.data().d);
    }
    return {iv:meta.iv, ct:parts.join(''), z:meta.z, at:meta.at, rev:meta.rev, dev:meta.dev};
  },
  async putHeader(h){
    const str = JSON.stringify(h);
    if(str === this.lastHdr) return;
    await this.retry(() => this.ref('vl-header').set(clone(h)));
    this.lastHdr = str;
  },
  async putBody(body){
    const prev = await this.getMeta().catch(() => null);
    if(prev && prev.rev === body.rev) return;
    if(prev && prev.off) prev.n = 0;
    const CH = 180000, n = Math.max(1, Math.ceil(body.ct.length / CH));
    for(let i = 0; i < n; i++){ const d = body.ct.slice(i * CH, (i + 1) * CH); await this.retry(() => this.ref(`vl-b-${body.rev}-${i}`).set({d})); }
    await this.retry(() => this.ref('vl-meta').set({rev:body.rev, n, iv:body.iv, z:body.z, at:body.at, dev:DEVICE}));
    this.lastRev = body.rev;
    if(prev && prev.rev && prev.rev !== body.rev){ for(let i = 0; i < prev.n; i++){ try{ await this.ref(`vl-b-${prev.rev}-${i}`).delete(); }catch(e){} } }
  },
  async wipe(){
    const m = await this.getMeta().catch(() => null);
    if(m) for(let i = 0; i < m.n; i++){ try{ await this.ref(`vl-b-${m.rev}-${i}`).delete(); }catch(e){} }
    try{ await this.ref('vl-header').delete(); }catch(e){}
    try{ await this.ref('vl-meta').set({off:true, at:now(), dev:DEVICE}); }catch(e){}
    this.lastHdr = ''; this.lastRev = null;
  }
};

function newVault(profile){

function upgradeVault(v){

/* ---------- unlock ---------- */
async function unlock(pw, pc){
  if(guard.wait()){ S.auth.pc = ''; render(); return; }
  S.auth.busy = true; render();
  await Promise.race([S.cloudP, sleep(3000)]);
  const lh = LS.get(K.header);
  const cands = [lh, S.cloudHeader].filter(Boolean).filter((h, i, arr) => arr.findIndex(x => JSON.stringify(x) === JSON.stringify(h)) === i).sort((a, b) => (b.hdrAt || 0) - (a.hdrAt || 0));
  let raw = null, used = null;
  for(const h of cands){ try{ raw = await unwrapCreds(h, pw, pc); used = h; break; }catch(e){} }
  if(!raw){
    const g = guard.fail();
    S.auth = {...S.auth, step:g.until > now() ? 2 : 1, pc:'', busy:false, shake:true, err:g.until > now() ? '' : 'That password and passcode don\'t match this vault. Check both and try again.', pw:g.until > now() ? S.auth.pw : ''};
    if(S.auth.step === 1) S.auth.pw = '';
    render(); startWaitTicker(); return;
  }
  guard.reset();
  try{ await openWith(raw, used); }
  catch(e){ console.error(e); S.auth = {step:1, pw:'', pc:'', busy:false, err:e.message || 'Could not open the vault.'}; render(); }
}
let waitTicker = null;
function startWaitTicker(){ clearInterval(waitTicker); waitTicker = setInterval(() => { const w = guard.wait(); const el = $('#waitline'); if(!w){ clearInterval(waitTicker); if(S.phase === 'login') render(); } else if(el) el.textContent = `Too many tries. Wait ${w}s, then try again.`; }, 1000); }
async function openWith(raw, header, opts = {}){
  S.dekRaw = raw; S.dek = await dekKey(raw); S.header = header; LS.set(K.header, header);
  let vault = opts.vault || null;
  const lb = opts.vault ? null : LS.get(K.body);
  if(lb){ try{ vault = await openVault(S.dek, lb); S.body = lb; }catch(e){ console.warn('local copy unreadable', e); } }
  if(Cloud.ready && !opts.vault){
    try{
      let meta = await Cloud.getMeta();
      if(meta && meta.off){ S.remoteOff = meta; meta = null; }
      if(meta && (!lb || meta.rev !== lb.rev)){
        const cb = await Cloud.getBody(meta);
        const rv = await openVault(S.dek, cb);
        vault = vault ? mergeVaults(upgradeVault(vault), upgradeVault(rv)) : rv;
        Cloud.lastRev = cb.rev; if(!S.body) S.body = cb;
      }
      if(meta) Cloud.lastAt = now();
    }catch(e){ console.warn('cloud read', e); }
  }
  if(!vault) throw new Error('Your vault data could not be read on this device. If you have a backup file, restore it from the first screen.');
  S.vault = upgradeVault(vault); hayCache = new WeakMap();
  if(S.remoteOff && S.vault.settings.sync && S.remoteOff.at > (S.vault.settings.updatedAt || 0)){ S.vault.settings.sync = false; S.vault.settings.updatedAt = S.remoteOff.at; }
  S.remoteOff = null;
  const purged = autoPurge();
  S.phase = 'app'; S.tab = 'vault'; S.filter = 'all'; S.q = ''; S.selId = null; S.mode = 'view';
  if(WEB && navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
  applyTheme(S.vault.settings.theme);
  lastAct = now();
  root.innerHTML = '';
  render();
  await persist();
  if(syncOn()){ await pushNow(); watchCloud(); }
  if(purged) toast(`Cleared ${purged} account${purged === 1 ? '' : 's'} deleted over 30 days ago`, 'trash');
  if(opts.toast) toast(opts.toast);
}

/* ---------- downloads ---------- */
const canDownload = () => !!S.downloads || !S.hasClaude;
async function saveFile(name, text){
  if(S.downloads){
    try{ await S.downloads.save({filename:name, data:text}); return 'saved'; }
    catch(e){ if(e && e.code === 'declined') return 'declined'; toast('Download is not available here. Use Copy instead.', 'warn'); return 'failed'; }
  }
  if(!S.hasClaude){
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/octet-stream'})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return 'saved';
  }
  return 'failed';
}
function recoveryKitText(rk, name, email){
  return `VAULTLEAF RECOVERY KIT\n\nVault owner: ${name || '(not set)'}${email ? '\nEmail: ' + email : ''}\nCreated: ${new Date().toLocaleString()}\n\nRecovery key:\n${rk}\n\nUse this key on the Vaultleaf unlock screen ("Forgot your password or passcode?")\nto choose a new master password and passcode.\n\nKeep this somewhere safe and away from the device you use Vaultleaf on.\nAnyone with this key and a copy of your vault data can open it.\n`;
}

function fieldRow(a, key, label, value, type, pills = ''){
  const secret = isSecret(type) || key === 'password' || key.startsWith('a:') || key.startsWith('h:');
  const rk = a.id + '|' + key, shown = !secret || S.revealed.has(rk);
  let v;
  if(type === 'totp'){
    const cfg = totpCfg(value);
    v = cfg.valid ? `<span class="totp"><b data-totp="${a.id}|${key}">${fmtCode(S.totpNow.get(rk))}</b><svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="bg" cx="12" cy="12" r="9"/><circle class="fg" cx="12" cy="12" r="9" stroke-dasharray="56.55" stroke-dashoffset="0"/></svg></span>` : `<span class="err">This 2FA key isn't valid. Edit it and paste the setup key again.</span>`;
  }
  else if(!value) v = `<span class="muted">Empty</span>`;
  else if(!shown) v = `<span class="masked mono">••••••••••</span>`;
  else if(type === 'phrase'){ const w = String(value).trim().split(/\s+/); v = `<div class="words">${w.map((x, i) => `<span><i>${i + 1}</i>${esc(x)}</span>`).join('')}</div>`; }
  else if(secret || ftype(type).mono) v = `<span class="mono">${colorize(value)}</span>`;
  else v = esc(value);
  const url = type === 'url' ? safeUrl(value) : '';
  const acts = `${secret && type !== 'totp' ? `<button class="icon-btn" data-act="reveal" data-id="${a.id}" data-k="${key}" aria-label="${shown ? 'Hide' : 'Show'} ${esc(label)}" title="${shown ? 'Hide' : 'Show'}">${ic(shown ? 'eyeoff' : 'eye')}</button>` : ''}${url ? `<a class="icon-btn" data-act="noop" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(label)}" title="Open">${ic('ext')}</a>` : ''}<button class="icon-btn" data-act="copy" data-id="${a.id}" data-k="${key}" aria-label="Copy ${esc(label)}" title="Copy">${ic('copy')}</button>`;
  return `<div class="frow" role="button" tabindex="0" data-act="copy" data-id="${a.id}" data-k="${key}" aria-label="Copy ${esc(label)}">
    <div class="fl">${esc(label)}${pills}</div><div class="fv">${v}</div><div class="fa">${acts}</div></div>`;
}
function pwPills(a){
  const s = strength(a.password);
  const cls = s.score <= 1 ? 'bad' : s.score === 2 ? 'warn' : 'good';
  const reused = V().accounts.filter(x => !x.trashedAt && x.id !== a.id && x.password && x.password === a.password).length;
  return `<span class="pill ${cls}">${s.label}</span>${reused ? `<span class="pill bad">Used on ${reused + 1} accounts</span>` : ''}${isOld(a) ? `<span class="pill warn">${ic('clock','s')}Set ${ago(a.pwChangedAt || a.createdAt)}</span>` : ''}`;
}
function detailHTML(a){

  if(a.username) signin.push(fieldRow(a, 'username', 'Username', a.username, 'text'));
  if(a.email) signin.push(fieldRow(a, 'email', 'Email', a.email, 'email'));
  if(a.password) signin.push(fieldRow(a, 'password', 'Password', a.password, 'password', pwPills(a)));
  for(const f of a.fields){
    const row = fieldRow(a, 'f:' + f.id, f.label || ftype(f.type).name, f.value, f.type);
    if(f.type === 'totp') signin.push(row); else if(isSecret(f.type)) secrets.push(row); else other.push(row);

  return `${topBar(a)}<div class="d-body">${trashed}
    <div class="d-head">${tile(a, 56)}<div style="min-width:0"><h2>${esc(a.tool)}</h2>${a.accountName ? `<div class="sub">${esc(a.accountName)}</div>` : ''}
      ${a.labels.length ? `<div class="d-tags">${a.labels.map(tagHTML).join('')}</div>` : ''}</div></div>
    ${sec('Sign-in', signin)}${sec('Keys and secrets', secrets)}${sec('Other details', other)}${sec('Security questions', qa)}${sec('Admins', admins)}
    ${a.notes ? `<div class="sec-wrap"><div class="sec-h"><h3>Notes</h3></div><div class="sec"><div class="notes-box">${esc(a.notes)}</div></div></div>` : ''}
    ${!signin.length && !secrets.length && !other.length && !qa.length && !a.notes ? `<div class="empty" style="padding:24px"><p>No details yet.</p><button class="btn" data-act="edit" data-id="${a.id}">Add details</button></div>` : ''}
    <div class="sec-wrap"><div class="sec-h"><h3>Record</h3></div><div class="sec"><div class="meta-grid">
      <div><span>Leaf</span><b class="tnum">No. ${String(a.no || 0).padStart(3, '0')}</b></div>
      <div><span>Stored</span><b title="${esc(fmtDT(a.createdAt))}">${fmtDate(a.createdAt)}</b></div>
      <div><span>Last edited</span><b title="${esc(fmtDT(a.updatedAt))}">${ago(a.updatedAt)}</b></div>
      ${a.password ? `<div><span>Password set</span><b title="${esc(fmtDT(a.pwChangedAt || a.createdAt))}">${fmtDate(a.pwChangedAt || a.createdAt)}</b></div>` : ''}

function healthData(){
  const accs = V().accounts.filter(a => !a.trashedAt), withPw = accs.filter(a => a.password);
  const weak = withPw.filter(a => strength(a.password).score <= 1);
  const groups = new Map(); for(const a of withPw){ const g = groups.get(a.password) || []; g.push(a); groups.set(a.password, g); }
  const reusedGroups = [...groups.values()].filter(g => g.length > 1);
  const reused = new Set(reusedGroups.flat());
  const old = withPw.filter(isOld);
  const no2fa = withPw.filter(a => !a.fields.some(f => f.type === 'totp' && f.value));
  const bad = new Set([...weak, ...reused, ...old]);
  const score = withPw.length ? Math.round(100 * (withPw.length - bad.size) / withPw.length) : 100;
  return {accs, withPw, weak, reusedGroups, reused, old, no2fa, score};
}
function healthHTML(){
  const h = healthData();

  const row = (a, why, pill) => `<div class="hrow" role="button" tabindex="0" data-act="goto" data-id="${a.id}">${tile(a, 36)}<div style="min-width:0"><b>${esc(a.tool)}</b>${a.accountName ? ` <span class="muted">${esc(a.accountName)}</span>` : ''}<div class="hint">${why}</div></div>${pill}</div>`;
  const block = (title, sub, rows) => `<div class="panel"><div class="panel-h"><h2>${title}</h2><p>${sub}</p></div><div style="padding-top:8px">${rows || `<p class="hint" style="padding:0 16px 16px;margin:0">${ic('check','s')} Nothing to fix here.</p>`}</div></div>`;
  return `<div class="page">${pageHead('Password health')}
    <div class="panel"><div class="score"><div class="score-dial"><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" stroke="var(--line)"/><circle cx="48" cy="48" r="40" stroke="${col}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - h.score / 100)}"/></svg><b class="tnum">${h.score}</b></div>
      <div><h2 style="font-size:20px">${h.score >= 80 ? 'In good shape' : h.score >= 50 ? 'A few things to fix' : 'Needs attention'}</h2><p class="muted" style="margin:4px 0 0">${h.withPw.length - new Set([...h.weak, ...h.reused, ...h.old]).size} of ${h.withPw.length} saved passwords have no problems.</p></div></div>
      <div class="stat-row"><div><b class="tnum">${h.weak.length}</b><span>Weak</span></div><div><b class="tnum">${h.reused.size}</b><span>Reused</span></div><div><b class="tnum">${h.old.length}</b><span>Overdue</span></div></div></div>
    ${block('Weak passwords', 'Easy to guess. Generate a new one and update it on the site.', h.weak.map(a => row(a, 'Rated ' + strength(a.password).label.toLowerCase(), `<span class="pill bad">Weak</span>`)).join(''))}
    ${block('Reused passwords', 'If one site leaks, every account sharing the password is exposed.', h.reusedGroups.map(g => g.map(a => row(a, `Same password as ${listJoin(g.filter(x => x !== a).map(x => esc(x.tool)))}`, `<span class="pill bad">${g.length} accounts</span>`)).join('')).join(''))}
    ${block('Due for a change', 'Past your reminder, or not changed in over a year.', h.old.map(a => row(a, 'Password set ' + ago(a.pwChangedAt || a.createdAt), `<span class="pill warn">${ic('clock','s')}Overdue</span>`)).join(''))}
    ${block('No 2FA code saved', 'Turn on two-step sign-in where the site offers it, then save the setup key here.', h.no2fa.map(a => row(a, 'Has a password but no 2FA code', `<span class="pill info">Optional</span>`)).join(''))}
  </div>`;

async function restoreGo(){
  const m = S.m;
  let text = $('#rs-text').value.trim();
  try{ const ft = await readFileInput($('#rs-file')); if(ft) text = ft.trim(); }catch(e){}
  if(!text) return mErr('Choose a backup file or paste the backup text.');
  let bk; try{ bk = JSON.parse(text); }catch(e){ return mErr('That isn\'t a Vaultleaf backup. Check you picked the .json file it saved.'); }
  if(!bk || bk.app !== APP || !bk.header || !bk.body) return mErr('That isn\'t a Vaultleaf backup. Check you picked the .json file it saved.');
  mErr(''); setModal(undefined, '<div class="spinner"></div>');
  let raw;
  try{ raw = m.rsMode === 'rk' ? await unwrapRecovery(bk.header, $('#rs-key').value) : await unwrapCreds(bk.header, $('#rs-pw').value, $('#rs-pc').value); }
  catch(e){ setModal(undefined, `<button class="btn" data-act="mclose">Cancel</button><button class="btn primary" data-act="rs-go">Open backup</button>`); return mErr(m.rsMode === 'rk' ? 'That recovery key doesn\'t open this backup.' : 'That password and passcode don\'t open this backup. Use the ones you had when it was made.'); }
  let vault;
  try{ vault = upgradeVault(await openVault(await dekKey(raw), bk.body)); }catch(e){ return mErr('The backup file is damaged and can\'t be read.'); }
  if(m.fresh){
    LS.set(K.header, bk.header); LS.set(K.body, bk.body); closeModal(); S.setup = null;
    await openWith(raw, bk.header, {vault, toast:`Restored ${vault.accounts.length} accounts`});
    return;
  }
  m.restored = vault;
  const n = vault.accounts.filter(a => !a.trashedAt).length, cur = new Set(V().accounts.map(a => a.id));
  const fresh = vault.accounts.filter(a => !cur.has(a.id)).length;
  setModal(`<p>The backup from ${fmtDT(bk.exportedAt)} holds <b>${n} accounts</b>. ${fresh} of them aren't in your vault right now.</p>
    <p class="muted"><b>Add missing accounts</b> keeps everything you have and brings back what's missing. <b>Replace</b> makes your vault exactly match the backup.</p>`,
    `<button class="btn" data-act="mclose">Cancel</button><button class="btn danger" data-act="rs-replace">Replace my vault</button><button class="btn primary" data-act="rs-merge">Add missing accounts</button>`);
}

function updatePins(len, n){ const p = root.querySelector('.pins'); if(p) p.outerHTML = pinsHTML(len, n); }
function kpInput(d){
  if(S.phase === 'login' && S.auth.step === 2){
    if(S.auth.busy || guard.wait()) return;
    const len = pcLenFromHeaders(), a = S.auth;
    if(d === 'del') a.pc = a.pc.slice(0, -1); else if(d === 'clear') a.pc = ''; else if(a.pc.length < len) a.pc += d;
    updatePins(len, a.pc.length);
    if(a.pc.length === len) unlock(a.pw, a.pc);
    return;
  }
  if(S.phase === 'setup' && S.setup && S.setup.step === 3){
    const st = S.setup; if(st.busy) return;
    const k = st.pcStage === 'confirm' ? 'pc2' : 'pc';
    if(d === 'del') st[k] = st[k].slice(0, -1); else if(d === 'clear') st[k] = ''; else if(st[k].length < st.pcLen) st[k] += d;
    if(st.err){ st.err = ''; const e = root.querySelector('.err'); if(e) e.remove(); }
    if(st[k].length < st.pcLen){ updatePins(st.pcLen, st[k].length); return; }
    if(st.pcStage === 'enter'){ st.pcStage = 'confirm'; st.pc2 = ''; render(); return; }
    if(st.pc2 !== st.pc){ Object.assign(st, {err:'Those didn\'t match. Set your passcode again.', pc:'', pc2:'', pcStage:'enter', shake:true}); render(); return; }
    setupAfterPasscode();
  }
}
async function setupAfterPasscode(){
  const st = S.setup; st.busy = true; render();
  if(st.mode === 'reset'){ await finishReset(); return; }
  st.dekRaw = rand(32); st.rk = newRecoveryKey();
  st.header = await makeHeader(st.pw, st.pc, st.dekRaw, st.rk);
  st.busy = false; st.step = 4; render();
}
async function recoverGo(){
  const key = $('#r-key').value;
  if(normRK(key).length < 20){ S.rec = {key, err:'Enter the full recovery key: 8 groups of 4 letters and numbers.'}; render(); return; }
  S.rec = {key, busy:true}; render();
  await Promise.race([S.cloudP, sleep(3000)]);
  let raw = null, used = null;
  for(const h of [LS.get(K.header), S.cloudHeader].filter(Boolean).sort((a, b) => (b.hdrAt || 0) - (a.hdrAt || 0))){ try{ raw = await unwrapRecovery(h, key); used = h; break; }catch(e){} }
  if(!raw){ guard.fail(); S.rec = {key, err:'That key doesn\'t open this vault. Check for typos. Dashes and spaces are optional.'}; render(); return; }
  guard.reset();
  S.rec = null; S.setup = Object.assign(newSetup('reset'), {dekRaw:raw, baseHeader:used, pcLen:used.pcLen || 6}); S.phase = 'setup'; render();
}

  'ed-gen'(el){ const g = genOpts(); const v = (g.mode === 'phrase' ? genPassphrase(g) : genPassword(g)).value; setPath(S.draft, el.dataset.p, v); S.edPeek.add(el.dataset.p); rerenderEditor(); toast('New password filled in. Save to keep it.', 'dice'); },
  'ed-add'(el){ const t = el.dataset.t; S.draft.fields.push({id:uid(), type:t, label:FT[t].name, value:''}); rerenderEditor(); const i = S.draft.fields.length - 1; const f = $(`#ed-fields-${i}-value`); if(f) f.focus(); },
  'ed-addrow'(el){ const l = el.dataset.list; S.draft[l].push(l === 'qa' ? {id:uid(), q:'', a:''} : {id:uid(), name:'', email:'', role:''}); rerenderEditor(); const i = S.draft[l].length - 1; const f = $(`[data-bind="${l}.${i}.${l === 'qa' ? 'q' : 'name'}"]`); if(f) f.focus(); },
  'ed-rm'(el){ S.draft[el.dataset.list].splice(+el.dataset.i, 1); rerenderEditor(); },
  'ed-label'(el){ const id = el.dataset.id, L = S.draft.labels; const i = L.indexOf(id); if(i >= 0) L.splice(i, 1); else L.push(id); el.setAttribute('aria-pressed', i < 0); },
  'ed-newlabel'(){ const inp = $('#ed-newlabel'), name = inp.value.trim(); if(!name) return; const id = ensureLabelPath(name); if(!S.draft.labels.includes(id)) S.draft.labels.push(id); persist(); rerenderEditor(); renderSide(); renderHead(); },
  'ed-insertpw'(){
    const ta = $('#ce'); if(!ta) return;
    const g = genOpts(), v = (g.mode === 'phrase' ? genPassphrase(g) : genPassword(g)).value;
    const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
    const before = ta.value.slice(0, s), lineStart = before.slice(before.lastIndexOf('\n') + 1);
    const ins = /:\s?$/.test(lineStart) || (lineStart && !/^\s*$/.test(lineStart) && s !== ta.value.length) ? v : (before && !before.endsWith('\n') ? '\n' : '') + 'Password: ' + v;
    ta.value = before + ins + ta.value.slice(e); S.noteText = ta.value;
    ta.focus(); ta.selectionStart = ta.selectionEnd = s + ins.length; afterEditorRender();
    toast('Strong password added to the note', 'dice');
  },
  // generator
  'gen-new'(){ regen(); updateGenOut(); },
  'gen-copy'(){ const v = S.genOut.value; copyText(v).then(ok => { toast(ok ? 'Password copied' : 'Copy was blocked. Select it and copy by hand.', ok ? 'copy' : 'warn'); if(ok) scheduleClipClear(); }); },
  'gen-use'(){ openPickAccount(); },
  'gen-mode'(el){ genOpts().mode = el.dataset.v; V().settings.updatedAt = now(); regen(); persist(); renderPage(); },
  'pa-pick'(el){ const a = acct(el.dataset.id), v = S.genOut.value; closeModal(); S.tab = 'vault'; startEdit(a, 'form'); S.draft.password = v; S.edPeek.add('password'); rerenderEditor(); toast('New password filled in. Save to keep it.', 'key'); },
  'pa-new'(){ const v = S.genOut.value; closeModal(); startNew('login', {password:v}); S.edPeek.add('password'); rerenderEditor(); },
  'act-filter'(el){ S.actFilter = el.dataset.v; renderPage(); },
  // settings & modals
  'm-chpw'(){ openChangePw(); }, 'cp-go'(){ changePw(); },
  'm-chpc'(){ openChangePc(); }, 'cc-go'(){ changePc(); },
  'm-newrk'(){ openNewRk(); }, 'rk-go'(){ newRk(); },
  'rk-copy'(){ copyText(S.m.rk).then(ok => toast(ok ? 'Recovery key copied' : 'Copy was blocked. Write the key down instead.', ok ? 'copy' : 'warn')); },
  'rk-dl'(){ saveFile('vaultleaf-recovery-kit.txt', recoveryKitText(S.m.rk, V().profile.name, V().profile.email)).then(r => { if(r === 'saved') toast('Recovery kit saved', 'download'); }); },
  'm-backup'(){ openBackup(); },
  'bk-copy'(){ copyText(S.m.backup).then(ok => { if(ok){ toast('Backup copied. Paste it somewhere safe.', 'copy'); markBackup(); } else toast('Copy was blocked here.', 'warn'); }); },
  'bk-dl'(){ saveFile(S.m.fname, S.m.backup).then(r => { if(r === 'saved'){ toast('Backup saved', 'download'); markBackup(); closeModal(); } }); },
  'm-restore'(){ openRestore(false); },
  'rs-mode'(el){ S.m.rsMode = el.dataset.v; modalsEl.querySelectorAll('[data-act="rs-mode"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.m.rsMode)); $('#rs-creds').hidden = S.m.rsMode !== 'creds'; $('#rs-rk').hidden = S.m.rsMode !== 'rk'; },
  'rs-go'(){ restoreGo(); },
  'rs-merge'(){ const before = V().accounts.length; S.vault = upgradeVault(restoreMerge(V(), S.m.restored)); hayCache = new WeakMap(); persist(); closeModal(); renderApp(); const n = Math.max(0, V().accounts.length - before); toast(n ? `Added ${n} account${n === 1 ? '' : 's'} from the backup` : 'Everything in the backup is already here', 'restore'); },
  'rs-replace'(){ const r = S.m.restored; confirmBox({title:'Replace your vault?', text:'Accounts that aren\'t in the backup will be deleted on every device.', ok:'Replace', danger:true, onOk:() => {
    const keep = new Set(r.accounts.map(a => a.id)), t = now();
    const tomb = V().accounts.filter(a => !keep.has(a.id)).map(a => ({id:a.id, at:t}));
    S.vault = upgradeVault({...r, settings:V().settings, profile:V().profile, tombstones:[...(r.tombstones || []), ...tomb], nextNo:Math.max(r.nextNo || 1, V().nextNo)});
    for(const a of S.vault.accounts) a.updatedAt = Math.max(a.updatedAt, t);
    S.selId = null; hayCache = new WeakMap(); persist(); renderApp(); toast('Vault replaced with the backup', 'restore');
  }}); },
  'import-notes'(){ openImportNotes(); },
  'in-sep'(el){ S.m.sep = el.dataset.v; modalsEl.querySelectorAll('[data-act="in-sep"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.m.sep)); previewNotes(); },
  'in-go'(){ const n = importItems(S.m.items, $('#in-label').value.trim()); closeModal(); S.tab = 'vault'; S.filter = 'all'; S.q = ''; S.mode = 'view'; renderApp(); toast(`Imported ${n} account${n === 1 ? '' : 's'}`, 'import'); },
  'import-csv'(){ openImportCsv(); },
  'ic-go'(){ const n = importItems(S.m.items, $('#ic-label').value.trim()); closeModal(); S.tab = 'vault'; S.filter = 'all'; S.q = ''; renderApp(); toast(`Imported ${n} account${n === 1 ? '' : 's'}. Now delete the CSV file.`, 'import'); },
  'm-export'(){ openExport(); },
  'ex-copy'(){ copyText(S.m.csv).then(ok => toast(ok ? 'CSV copied' : 'Copy was blocked here.', ok ? 'copy' : 'warn')); },
  'ex-dl'(){ saveFile('vaultleaf-export.csv', S.m.csv).then(r => { if(r === 'saved'){ toast('CSV saved. Delete it after importing.', 'download'); closeModal(); } }); },
  'm-delete'(){ openDelete(); }, 'dv-go'(){ deleteVault(); },
  'sync-now'(){ syncNow().then(() => toast(Cloud.status === 'err' ? Cloud.err : 'Synced', Cloud.status === 'err' ? 'warn' : 'cloud')); }
};
function guardEditor(fn){
  if(S.mode === 'view' || !S.draft) return fn();
  const cur = S.editKind === 'note' ? ($('#ce') ? $('#ce').value : S.noteText) : null;
  const dirty = S.editKind === 'note' ? cur !== S.noteOrig : stable(S.draft) !== S.orig;
  const go = () => { S.mode = 'view'; S.draft = null; fn(); };
  if(!dirty) return go();
  confirmBox({title:'Discard changes?', text:'You have unsaved edits to this account.', ok:'Discard', danger:true, onOk:go});
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if(e.target.dataset && e.target.dataset.scrim){ closeModal(); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.dataset.act !== 'noop') e.preventDefault();
  if(el.disabled) return;
  fn(el, e);
});
let prevTimer = null, genSaveTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ S.q = t.value; $('[data-act="clearq"]').hidden = !S.q; renderList(); return; }
  if(t.id === 'l-pw'){ S.auth.pw = t.value; return; }
  if(t.dataset.sf && t.type !== 'checkbox'){ S.setup[t.dataset.sf] = t.value; if(t.dataset.sf === 'pw') updateMeter('s-meter', t.value); return; }
  if(t.dataset.bind && t.tagName !== 'SELECT' && S.draft){
    let v = t.value;
    if(t.dataset.date){ if(!v) return; v = new Date(v + 'T12:00:00').getTime(); }
    setPath(S.draft, t.dataset.bind, v);
    if(t.dataset.bind === 'password') updateMeter('ed-meter', v);
    return;
  }
  if(t.dataset.gen && (t.type === 'range')){ const g = genOpts(); g[t.dataset.gen] = +t.value; const lv = $(`#g-${t.dataset.gen}-v`); if(lv) lv.textContent = t.value; regen(); updateGenOut(); clearTimeout(genSaveTimer); genSaveTimer = setTimeout(persist, 600); return; }
  if(t.dataset.meter){ updateMeter(t.dataset.meter, t.value); return; }
  if(t.id === 'in-text'){ clearTimeout(prevTimer); prevTimer = setTimeout(previewNotes, 150); return; }
  if(t.id === 'pa-q'){ const q = t.value.toLowerCase(); $('#pa-list').innerHTML = pickRows(V().accounts.filter(a => !a.trashedAt && hay(a).includes(q)).sort((a, b) => a.tool.localeCompare(b.tool))); return; }
  if(t.id === 'ce'){ S.noteText = t.value; afterEditorRender(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.sf && t.type === 'checkbox'){ S.setup[t.dataset.sf] = t.checked; if(t.dataset.sf === 'saved'){ const b = $('[data-act="s-finish"]'); if(b) b.disabled = !t.checked; } return; }
  if(t.dataset.bind && t.tagName === 'SELECT' && S.draft){ setPath(S.draft, t.dataset.bind, t.dataset.num ? +t.value : t.value); if(t.dataset.rerender) rerenderEditor(); return; }
  if(t.dataset.gen && t.type !== 'range'){ const g = genOpts(); g[t.dataset.gen] = t.type === 'checkbox' ? t.checked : t.value; regen(); updateGenOut(); persist(); return; }
  if(t.dataset.set){
    const path = t.dataset.set, val = t.type === 'checkbox' ? t.checked : t.dataset.num ? +t.value : t.value;
    if(path === 'settings.sync' && !val){
      t.checked = true;
      confirmBox({title:'Turn off sync?', text:'The encrypted copy is removed from sync. This device keeps everything. Your other devices keep what they have but stop updating.', ok:'Turn off sync', danger:true, onOk:async () => { V().settings.sync = false; V().settings.updatedAt = now(); clearTimeout(pushTimer); await persist(); await Cloud.wipe(); setSync('ok'); renderPage(); renderSide(); toast('Sync is off', 'cloud'); }});
      return;
    }
    setPath(V(), path, val); V().settings.updatedAt = now(); persist();
    if(path === 'settings.sort'){ renderList(); return; }
    if(path === 'settings.sync' && val){ pushNow(); watchCloud(); renderPage(); renderSide(); toast('Sync is on', 'cloud'); return; }
    toast('Saved', 'check');
    return;
  }
  if(t.dataset.prof){ V().profile[t.dataset.prof] = t.value.trim(); V().profile.updatedAt = now(); persist(); toast('Saved', 'check'); return; }
  if(t.id === 'ic-file'){ previewCsv(); return; }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if(f.dataset.form === 'login-pw'){
    const pw = $('#l-pw').value;
    if(!pw){ S.auth.err = 'Enter your master password.'; render(); return; }
    if(guard.wait()){ render(); return; }
    S.auth = {...S.auth, pw, step:2, pc:'', err:'', info:''}; render();
  }
});
document.addEventListener('keydown', e => {
  const t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if(e.key === 'Escape'){
    if(S.m){ closeModal(); return; }
    if(S.phase === 'app' && S.mode !== 'view'){ cancelEditor(); return; }
    if(S.phase === 'app' && S.selId && matchMedia('(max-width:759px)').matches){ S.selId = null; renderApp(); }
    return;
  }
  const kpActive = (S.phase === 'login' && S.auth.step === 2) || (S.phase === 'setup' && S.setup && S.setup.step === 3);
  if(kpActive && !typing && !S.m){
    if(/^\d$/.test(e.key)){ e.preventDefault(); kpInput(e.key); return; }
    if(e.key === 'Backspace'){ e.preventDefault(); kpInput('del'); return; }
  }
  if(t.id === 'r-key' && e.key === 'Enter'){ e.preventDefault(); recoverGo(); return; }
  if(t.id === 'ed-newlabel' && e.key === 'Enter'){ e.preventDefault(); ACT['ed-newlabel'](); return; }
  if(S.phase !== 'app' || S.m) return;
  if(!typing && e.key === '/' ){ e.preventDefault(); if(S.tab !== 'vault'){ S.tab = 'vault'; renderApp(); } $('#q').focus(); return; }
  if(!typing && (e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); ACT.new(); return; }
  if(!typing && (e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act){ e.preventDefault(); t.click(); }
});
setInterval(tickTotp, 1000);
async function tickTotp(){
  if(S.phase !== 'app') return;
  const els = document.querySelectorAll('[data-totp]'); if(!els.length) return;
  const t = now();
  for(const el of els){
    const [id, key] = el.dataset.totp.split('|'); const a = acct(id); if(!a) continue;
    const f = a.fields.find(x => 'f:' + x.id === key); if(!f) continue;
    const cfg = totpCfg(f.value); if(!cfg.valid) continue;
    try{ const code = await totpCode(cfg, t); S.totpNow.set(id + '|' + key, code); el.textContent = fmtCode(code); }catch(e){ el.textContent = 'Invalid key'; }
    const ring = el.parentElement && el.parentElement.querySelector('.ring');
    if(ring){ const rem = cfg.period - (Math.floor(t / 1000) % cfg.period); ring.querySelector('.fg').style.strokeDashoffset = String(56.55 * (1 - rem / cfg.period)); ring.classList.toggle('low', rem <= 5); }
  }
}

/* ---------- boot ---------- */
async function boot(){
  const ui = LS.get(K.ui); if(ui && ui.theme) applyTheme(ui.theme);
  if(!(window.crypto && crypto.subtle)){ S.phase = 'fatal'; S.fatal = 'This browser can\'t encrypt your vault safely.'; render(); return; }
  if(S.hasClaude){ try{ window.claude.use('downloads').then(d => { S.downloads = d || null; }).catch(() => {}); }catch(e){} }
  S.cloudP = Cloud.init().then(async ok => { if(ok){ try{ S.cloudHeader = await Cloud.getHeader(); }catch(e){} } return ok; });
  if(guard.wait()) startWaitTicker();
  if(WEB && 'serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js').catch(() => {}); }catch(e){} }
  if(LS.get(K.header)){ S.phase = 'login'; render(); return; }
  S.phase = 'boot'; render();
  await Promise.race([S.cloudP, sleep(11000)]);
  if(S.phase !== 'boot') return;
  if(S.cloudHeader) S.phase = 'login'; else { S.phase = 'setup'; S.setup = newSetup(); }
  render();
}
boot();

</script>
