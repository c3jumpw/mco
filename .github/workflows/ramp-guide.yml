# Keeps RAMP's change log, getting-started tours, What's new slides and Guide screenshots in step with the app.
# On every push to main that changes RAMP it:
#   • fails if the push changes the app or database without adding to the change log (ramp/CLAUDE.md);
#   • checks that every page has Guide coverage and the change log is valid, retakes the screenshots from the
#     sample-data preview (only screens that really changed are rewritten) and commits them. Vercel deploys them.
# See ramp/tools/guide/README.md.
name: RAMP guide

on:
  push:
    branches: [main]
    paths:
      - 'ramp/src/**'
      - 'ramp/tools/**'
      - 'ramp/supabase/**'
      - 'ramp/package.json'
      - '.github/workflows/ramp-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ramp-guide
  cancel-in-progress: false

jobs:
  changelog:
    name: Change log has an entry for this update
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Every RAMP change is in the change log
        run: node ramp/tools/changelog/require-entry.mjs "${{ github.event.before }}" "${{ github.sha }}"

  refresh:
    name: Check coverage and retake screenshots
    runs-on: ubuntu-24.04  # pinned: the Playwright version in package.json supports it
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ramp
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ramp/package-lock.json

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check every page has a Guide section and every image a screenshot recipe
        run: npm run guide:check

      - name: Retake screenshots
        run: npm run guide:shots
        env:
          CI: 'true'

      - name: Check again and type-check
        run: |
          npm run guide:check
          npm run typecheck

      - name: Commit the refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide-media src/guide/guide.json
          if git diff --cached --quiet; then echo "Screenshots were already current"; exit 0; fi
          git commit -m "RAMP: refresh guide and tour screenshots"
          git pull --rebase origin main
          git push origin HEAD:main
